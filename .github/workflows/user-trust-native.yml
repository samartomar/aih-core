name: Native user trust acceptance

on:
  pull_request:
    paths:
      - 'src/harness/user-trust*'
      - 'src/core/repair.ts'
      - 'src/core/trust.ts'
      - 'src/harness/trust*'
      - 'scripts/ci/user-trust-native.mjs'
      - '.github/workflows/user-trust-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: User trust (${{ matrix.os }}, ${{ matrix.contract }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
        contract: [legacy, shared]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      AIHQ_TRUST_CONTRACT: ${{ matrix.contract }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'
      - name: Provision native fixture tools
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          miniforge-version: latest
          activate-environment: ''
          auto-activate: true
          # Avoid conda init rewriting the Windows launcher; activate the installed hook below.
          run-init: ${{ runner.os != 'Windows' }}
      - name: Build candidate
        shell: bash -el {0}
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Packed native acceptance
        shell: bash -el {0}
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            source "$(cygpath -u "$CONDA")/etc/profile.d/conda.sh"
            conda activate base
          fi
          mkdir -p native-trust-results
          python --version > native-trust-results/tool-versions.txt
          pip --version >> native-trust-results/tool-versions.txt
          git --version >> native-trust-results/tool-versions.txt
          cargo --version >> native-trust-results/tool-versions.txt
          conda --version >> native-trust-results/tool-versions.txt
          uname -a >> native-trust-results/tool-versions.txt
          npm exec --offline --call 'node scripts/ci/user-trust-native.mjs'
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-user-trust-${{ matrix.os }}-${{ matrix.contract }}
          path: native-trust-results/
          if-no-files-found: warn
