name: Core package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-linux-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/build-linux-facility.mjs --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-linux-facility
          path: .scratch/native-linux-build/
          if-no-files-found: error
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['24']
        include:
          - os: ubuntu-latest
            node: '24.15.0'
    runs-on: ${{ matrix.os }}
    # Windows subprocess/packed-consumer checks already approach 20-25 minutes on
    # hosted runners. Keep room for the packed fixtures' own npm budgets to
    # expire and report before the job is cancelled.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 20 }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The old-Core compatibility test builds the pre-feature base commit from history; a shallow clone would skip it.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
