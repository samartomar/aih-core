name: Core package checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-state-diagnostic:
    # Temporary branch-only reproduction. Restore the normal matrix before PR.
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/ci/windows-state-diagnostic.mjs
