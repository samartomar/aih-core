name: Core package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['24']
        include:
          - os: ubuntu-latest
            node: '24.15.0'
    runs-on: ${{ matrix.os }}
    # Windows subprocess/packed-consumer checks already approach 20 minutes on
    # hosted runners. Keep room for the full suite to finish after additions.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 35 || 20 }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The old-Core compatibility test builds the pre-feature base commit from history; a shallow clone would skip it.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
