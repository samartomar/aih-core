name: Native macOS trust acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-26-arm64:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run native tests and private-CA repair
        shell: bash
        run: bash scripts/ci/macos-trust.sh
